name: claudew

x-worker: &worker
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
  environment:
    HOME: /claudew
    IS_SANDBOX: "1"
  stdin_open: true
  tty: true
  working_dir: /claudew
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 2g
  env_file:
    - .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - network
  healthcheck:
    test: ["CMD", "test", "-f", "/opt/claudew/.ready"]
    interval: 1s

services:
  red:
    <<: *worker
    container_name: red
    hostname: red
    volumes:
      - ./volumes/red:/claudew
      - /var/run/docker.sock:/var/run/docker.sock

  green:
    <<: *worker
    container_name: green
    hostname: green
    volumes:
      - ./volumes/green:/claudew
      - /var/run/docker.sock:/var/run/docker.sock

  blue:
    <<: *worker
    container_name: blue
    hostname: blue
    volumes:
      - ./volumes/blue:/claudew
      - /var/run/docker.sock:/var/run/docker.sock

  yellow:
    <<: *worker
    container_name: yellow
    hostname: yellow
    volumes:
      - ./volumes/yellow:/claudew
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  network:
