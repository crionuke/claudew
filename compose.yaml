name: claudew

x-worker: &worker
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
  environment:
    HOME: /claudew
    IS_SANDBOX: "1"
  stdin_open: true
  tty: true
  working_dir: /claudew
  env_file:
    - .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - network

services:
  worker-a:
    <<: *worker
    container_name: worker-a
    hostname: worker-a
    volumes:
      - ./workspace-a:/claudew
      - /var/run/docker.sock:/var/run/docker.sock

  worker-b:
    <<: *worker
    container_name: worker-b
    hostname: worker-b
    volumes:
      - ./workspace-b:/claudew
      - /var/run/docker.sock:/var/run/docker.sock

  worker-c:
    <<: *worker
    container_name: worker-c
    hostname: worker-c
    volumes:
      - ./workspace-c:/claudew
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  network:
