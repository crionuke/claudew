name: claudew

x-worker: &worker
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
  environment:
    HOME: /claudew
    IS_SANDBOX: "1"
  stdin_open: true
  tty: true
  working_dir: /claudew
  env_file:
    - .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - network
  healthcheck:
    test: ["CMD", "test", "-f", "/opt/claudew/.ready"]
    interval: 1s

services:
  worker_a:
    <<: *worker
    container_name: worker_a
    hostname: worker_a
    volumes:
      - ./volumes/worker_a:/claudew
      - /var/run/docker.sock:/var/run/docker.sock

  worker_b:
    <<: *worker
    container_name: worker_b
    hostname: worker_b
    volumes:
      - ./volumes/worker_b:/claudew
      - /var/run/docker.sock:/var/run/docker.sock

  worker_c:
    <<: *worker
    container_name: worker_c
    hostname: worker_c
    volumes:
      - ./volumes/worker_c:/claudew
      - /var/run/docker.sock:/var/run/docker.sock

  worker_d:
    <<: *worker
    container_name: worker_d
    hostname: worker_d
    volumes:
      - ./volumes/worker_d:/claudew
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  network:
