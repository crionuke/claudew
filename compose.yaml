x-claudew: &claudew
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
  stdin_open: true
  tty: true
  working_dir: /home/claudew
  environment:
    GH_TOKEN: ${GH_TOKEN}
    CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}

services:
  claudew_r:
    <<: *claudew
    container_name: claudew_r
    hostname: claudew_r
    volumes:
      - ./workspace_r:/home/claudew
      - ./config:/opt/claudew/config:ro

  claudew_g:
    <<: *claudew
    container_name: claudew_g
    hostname: claudew_g
    volumes:
      - ./workspace_g:/home/claudew
      - ./config:/opt/claudew/config:ro

  claudew_b:
    <<: *claudew
    container_name: claudew_b
    hostname: claudew_b
    volumes:
      - ./workspace_b:/home/claudew
      - ./config:/opt/claudew/config:ro