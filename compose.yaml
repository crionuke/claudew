name: claudew

x-claudew: &claudew
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
  stdin_open: true
  tty: true
  working_dir: /home/claudew
  env_file:
    - .env
  networks:
    - network

x-dind: &dind
  image: docker:dind
  privileged: true
  restart: unless-stopped
  environment:
    DOCKER_TLS_CERTDIR: ""
  networks:
    - network

services:
  claudew_a-docker:
    <<: *dind
    container_name: claudew_a-docker
    hostname: claudew_a-docker
    volumes:
      - dind_a:/var/lib/docker

  claudew_a:
    <<: *claudew
    container_name: claudew_a
    hostname: claudew_a
    environment:
      DOCKER_HOST: tcp://claudew_a-docker:2375
    depends_on:
      - claudew_a-docker
    volumes:
      - ./workspace_a:/home/claudew

  claudew_b-docker:
    <<: *dind
    container_name: claudew_b-docker
    hostname: claudew_b-docker
    volumes:
      - dind_b:/var/lib/docker

  claudew_b:
    <<: *claudew
    container_name: claudew_b
    hostname: claudew_b
    environment:
      DOCKER_HOST: tcp://claudew_b-docker:2375
    depends_on:
      - claudew_b-docker
    volumes:
      - ./workspace_b:/home/claudew

  claudew_c-docker:
    <<: *dind
    container_name: claudew_c-docker
    hostname: claudew_c-docker
    volumes:
      - dind_c:/var/lib/docker

  claudew_c:
    <<: *claudew
    container_name: claudew_c
    hostname: claudew_c
    environment:
      DOCKER_HOST: tcp://claudew_c-docker:2375
    depends_on:
      - claudew_c-docker
    volumes:
      - ./workspace_c:/home/claudew

networks:
  network:

volumes:
  dind_a:
  dind_b:
  dind_c:
