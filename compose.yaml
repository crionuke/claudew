name: claudew

x-claudew: &claudew
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
  stdin_open: true
  tty: true
  working_dir: /home/claudew
  env_file:
    - .env
  networks:
    - network

x-dind: &dind
  image: docker:dind
  privileged: true
  restart: unless-stopped
  environment:
    DOCKER_TLS_CERTDIR: ""
  networks:
    - network

services:
  docker-a:
    <<: *dind
    container_name: docker-a
    hostname: docker-a

  claudew-a:
    <<: *claudew
    container_name: claudew-a
    hostname: claudew-a
    environment:
      DOCKER_HOST: tcp://docker-a:2375
      TEST_HOST: docker-a
    depends_on:
      - docker-a
    volumes:
      - ./workspace-a:/home/claudew

  docker-b:
    <<: *dind
    container_name: docker-b
    hostname: docker-b

  claudew-b:
    <<: *claudew
    container_name: claudew-b
    hostname: claudew-b
    environment:
      DOCKER_HOST: tcp://docker-b:2375
      TEST_HOST: docker-b
    depends_on:
      - docker-b
    volumes:
      - ./workspace-b:/home/claudew

  docker-c:
    <<: *dind
    container_name: docker-c
    hostname: docker-c

  claudew-c:
    <<: *claudew
    container_name: claudew-c
    hostname: claudew-c
    environment:
      DOCKER_HOST: tcp://docker-c:2375
      TEST_HOST: docker-c
    depends_on:
      - docker-c
    volumes:
      - ./workspace-c:/home/claudew

networks:
  network:
