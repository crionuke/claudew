name: claudew

x-claudew: &claudew
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
  stdin_open: true
  tty: true
  working_dir: /home/claudew
  env_file:
    - .env
  environment:
    DOCKER_HOST: tcp://docker:2375
  networks:
    - network

services:
  docker:
    image: alpine/socat
    container_name: docker
    command: tcp-listen:2375,fork,reuseaddr unix-connect:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  claudew_r:
    <<: *claudew
    container_name: claudew_r
    hostname: claudew_r
    volumes:
      - ./workspace_r:/home/claudew

  claudew_g:
    <<: *claudew
    container_name: claudew_g
    hostname: claudew_g
    volumes:
      - ./workspace_g:/home/claudew

  claudew_b:
    <<: *claudew
    container_name: claudew_b
    hostname: claudew_b
    volumes:
      - ./workspace_b:/home/claudew

networks:
  network: